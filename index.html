<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<title>💪 亮介のトレ記録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0a0a14;color:#e2e8f0;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;min-height:100vh;padding-bottom:80px;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select{font-family:inherit;outline:none;}
select option{background:#1e1e3f;color:#fff;}
.header{background:linear-gradient(90deg,#1e1e3f,#2d1b69);padding:16px 16px 12px;border-bottom:1px solid rgba(139,92,246,0.3);position:sticky;top:0;z-index:100;}
.header-sub{font-size:10px;color:#a78bfa;letter-spacing:3px;margin-bottom:2px;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header-title{font-size:18px;font-weight:700;color:#fff;}
.kcal-badge{background:linear-gradient(135deg,#7c3aed,#4f46e5);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;color:#fff;}
.tabs{display:flex;background:rgba(255,255,255,0.04);margin:12px 12px 0;border-radius:14px;padding:3px;border:1px solid rgba(139,92,246,0.2);}
.tab-btn{flex:1;padding:9px 0;border-radius:10px;font-size:10px;font-weight:700;color:#94a3b8;background:transparent;transition:all 0.2s;}
.tab-btn.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;}
.content{padding:12px 12px 0;}
.card{background:rgba(255,255,255,0.04);border-radius:14px;padding:14px;border:1px solid rgba(139,92,246,0.2);margin-bottom:14px;}
.section-title{font-size:13px;color:#a78bfa;font-weight:700;margin-bottom:10px;}
.lbl{font-size:11px;color:#64748b;margin-bottom:4px;}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;padding:7px 10px;font-size:14px;}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:700;}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:700;}
.btn-cyan{background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.3)!important;color:#67e8f9;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;}
.ex-btn{padding:5px 10px;border-radius:20px;font-size:11px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#94a3b8;}
.ex-btn.active{border-color:#7c3aed;background:rgba(124,58,237,0.3);color:#c4b5fd;font-weight:700;}
.log-row{background:rgba(255,255,255,0.04);border:1px solid rgba(139,92,246,0.2);border-radius:12px;padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.empty{text-align:center;padding:24px 16px;color:#334155;font-size:12px;border:1px dashed rgba(255,255,255,0.07);border-radius:12px;margin-bottom:12px;}
.tag{padding:1px 6px;border-radius:7px;font-size:10px;font-weight:700;}
.timer-banner{border-bottom:1px solid rgba(139,92,246,0.4);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.timer-num{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px;}
.timer-bar-wrap{width:80px;height:6px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin-bottom:8px;}
.timer-bar{height:100%;background:linear-gradient(90deg,#7c3aed,#22c55e);border-radius:4px;transition:width 1s linear;}
.step-card{margin-bottom:8px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);padding:10px 12px;}
.step-card.active{border-color:#7c3aed;background:rgba(124,58,237,0.15);}
.step-num{background:rgba(139,92,246,0.3);color:#a78bfa;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;}
.muscle-bar-wrap{height:8px;background:rgba(255,255,255,0.07);border-radius:10px;overflow:hidden;}
.muscle-bar{height:100%;border-radius:10px;transition:width 0.6s ease;}
.graph-wrap{overflow-x:auto;}
canvas{display:block;}
.err-box{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:8px;padding:8px 12px;font-size:12px;color:#fca5a5;margin-bottom:10px;}
.custom-form{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.25);border-radius:12px;padding:14px;margin-bottom:14px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
input[type=number]::-webkit-inner-spin-button{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SK="trlog_v5", CK="trcustom_v5", BW=73;

const BASE=[
{id:“bench”,name:“ベンチプレス”,muscles:[“胸”],met:5.0,unit:“kg×回”},
{id:“squat”,name:“スクワット”,muscles:[“脚”,“お尻”],met:5.0,unit:“kg×回”},
{id:“deadlift”,name:“デッドリフト”,muscles:[“背中”,“脚”,“お尻”],met:6.0,unit:“kg×回”},
{id:“pullup”,name:“懸垂”,muscles:[“背中”,“腕”],met:8.0,unit:“回”},
{id:“scapula”,name:“懸垂スキャプラ”,muscles:[“背中”,“肩”],met:4.0,unit:“回”},
{id:“neg_pullup”,name:“ネガティブ懸垂”,muscles:[“背中”,“腕”],met:5.0,unit:“回”},
{id:“leg_raise”,name:“レッグレイズ（懸垂機）”,muscles:[“腹”],met:5.0,unit:“回”},
{id:“leg_press”,name:“レッグプレス”,muscles:[“脚”,“お尻”],met:5.0,unit:“kg×回”},
{id:“burpee”,name:“バーピー”,muscles:[“全身”,“腹”,“脚”],met:10.0,unit:“秒”},
{id:“burpee_nj”,name:“バーピー（ジャンプなし）”,muscles:[“全身”,“腹”,“脚”],met:8.0,unit:“秒”},
{id:“jj”,name:“ジャンピングジャック”,muscles:[“脚”,“肩”],met:8.0,unit:“秒”},
{id:“jackknife”,name:“スタンディングジャックナイフ”,muscles:[“腹”],met:5.0,unit:“回”},
{id:“shoulder”,name:“ショルダープレス”,muscles:[“肩”,“腕”],met:4.5,unit:“kg×回”},
{id:“row”,name:“ベントオーバーロウ”,muscles:[“背中”,“腕”],met:5.0,unit:“kg×回”},
{id:“curl”,name:“バイセップカール”,muscles:[“腕”],met:3.5,unit:“kg×回”},
{id:“plank”,name:“プランク”,muscles:[“腹”],met:4.0,unit:“秒”},
{id:“bridge”,name:“下向きブリッジ（上下肢挙上）”,muscles:[“腹”,“背中”,“お尻”],met:3.5,unit:“秒×セット”},
{id:“crunch”,name:“クランチ”,muscles:[“腹”],met:4.0,unit:“回”},
{id:“lunge”,name:“ランジ”,muscles:[“脚”,“お尻”],met:4.5,unit:“回”},
{id:“pushup”,name:“腕立て（ノーマル）”,muscles:[“胸”,“腕”,“肩”],met:5.0,unit:“回”},
{id:“pushup_low”,name:“腕立て（胸筋下部）”,muscles:[“胸”,“腕”],met:5.0,unit:“回”},
{id:“walking”,name:“ウォーキング”,muscles:[“脚”],met:3.5,unit:“分”},
{id:“running”,name:“ランニング”,muscles:[“脚”],met:9.0,unit:“分”},
];

const PRESET={
name:“⚡ 時間ない時用トレーニング2（週3回）”,
intervalSec:60,
steps:[
{exId:“scapula”,label:“懸垂スキャプラ”,reps:5,sets:1,weight:0,sec:0,note:””},
{exId:“pullup”,label:“懸垂”,reps:11,sets:3,weight:0,sec:0,note:“レッグレイズと交互”},
{exId:“leg_raise”,label:“レッグレイズ（懸垂機・背中あり）”,reps:15,sets:3,weight:0,sec:0,note:“懸垂と交互”},
{exId:“neg_pullup”,label:“ネガティブ懸垂（4秒下ろし）”,reps:4,sets:1,weight:0,sec:0,note:“4秒かけてゆっくり”},
{exId:“leg_press”,label:“レッグプレス”,reps:15,sets:3,weight:45,sec:0,note:””},
{exId:“burpee”,label:“バーピー”,reps:1,sets:2,weight:0,sec:45,note:“45秒×2セット”},
{exId:“burpee_nj”,label:“バーピー（ジャンプなし）”,reps:1,sets:1,weight:0,sec:45,note:“45秒×1セット”},
{exId:“jj”,label:“ジャンピングジャック”,reps:1,sets:1,weight:0,sec:45,note:“45秒×1セット”},
{exId:“jackknife”,label:“スタンディングジャックナイフ”,reps:40,sets:1,weight:0,sec:0,note:””},
]
};

const MUSCLES=[“胸”,“背中”,“腕”,“肩”,“腹”,“脚”,“お尻”,“全身”];
const MC={胸:”#ef4444”,背中:”#f97316”,腕:”#eab308”,肩:”#22c55e”,腹:”#06b6d4”,脚:”#6366f1”,お尻:”#ec4899”,全身:”#a78bfa”};
const ME={胸:“💪”,背中:“🏋️”,腕:“💪”,肩:“🔝”,腹:“🎯”,脚:“🦵”,お尻:“🍑”,全身:“⚡”};
const UNITS=[“回”,“kg×回”,“秒”,“秒×セット”,“分”];

const todayKey=()=>new Date().toISOString().slice(0,10);
const fmtDate=k=>{const[y,m,d]=k.split(”-”);return`${y}年${+m}月${+d}日`;};
const pad=n=>String(n).padStart(2,“0”);
const fmtTime=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
const vInt=(v,mn,mx)=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=mn&&n<=mx?n:null;};

function stepCal(step,exs){
const ex=exs.find(e=>e.id===step.exId);if(!ex)return 0;
if(step.sec>0)return Math.round(ex.met*BW*(step.sec*step.sets)/3600);
return Math.round((step.weight||BW)*(step.reps||0)*(step.sets||1)*ex.met*0.0012);
}

function loadCustom(){
try{
const r=JSON.parse(localStorage.getItem(CK)||”[]”);
if(!Array.isArray(r))return[];
return r.filter(e=>e&&typeof e.id===“string”&&e.id.startsWith(“custom_”)&&typeof e.name===“string”&&e.name.length>0&&e.name.length<50&&typeof e.met===“number”&&e.met>0&&e.met<30&&UNITS.includes(e.unit)&&Array.isArray(e.muscles));
}catch{return[];}
}

function sanLog(raw,ids){
if(!Array.isArray(raw))return[];
return raw.filter(e=>e&&typeof e.id===“number”&&typeof e.name===“string”&&e.name.length<100&&ids.has(e.exId)&&typeof e.calories===“number”&&e.calories>=0&&e.calories<99999&&Array.isArray(e.muscles)&&typeof e.effect===“number”);
}

function loadData(ids){
try{
const r=JSON.parse(localStorage.getItem(SK)||”{}”);
if(typeof r!==“object”||Array.isArray(r))return{};
const c={};
for(const[k,v]of Object.entries(r)){if(/^\d{4}-\d{2}-\d{2}$/.test(k))c[k]=sanLog(v,ids);}
return c;
}catch{return{};}
}

// ─── State ───────────────────────────────────────────────────────────────────
let state={
tab:“preset”,
custom:loadCustom(),
data:{},
vDate:todayKey(),
sel:null,
sets:“3”,reps:“10”,wt:“0”,mins:“30”,secs:“45”,
err:””,
showC:false,
cName:””,cMet:“5”,cUnit:“回”,cMus:[],cErr:””,
tSec:0,tMax:0,tLbl:””,tActive:false,
step:null,
done:false,
};

// init data after custom loaded
(()=>{
const ids=new Set([…BASE,…state.custom].map(e=>e.id));
state.data=loadData(ids);
})();

let timerInterval=null;

function save(){
try{localStorage.setItem(SK,JSON.stringify(state.data));}catch{}
try{localStorage.setItem(CK,JSON.stringify(state.custom));}catch{}
}

function render(){
const exs=[…BASE,…state.custom];
const ids=new Set(exs.map(e=>e.id));
const today=state.data[todayKey()]||[];
const totalCal=today.reduce((s,e)=>s+e.calories,0);

const mEff={};MUSCLES.forEach(m=>mEff[m]=0);
today.forEach(e=>e.muscles.forEach(m=>{mEff[m]=Math.min(100,(mEff[m]||0)+e.effect);}));

const hDates=Object.keys(state.data).filter(k=>(state.data[k]||[]).length>0).sort((a,b)=>b.localeCompare(a));
const selEx=exs.find(e=>e.id===state.sel);

let html=`

  <div class="header">
    <div class="header-sub">TRAINING MANAGER</div>
    <div class="header-row">
      <div class="header-title">💪 亮介のトレ記録</div>
      <div class="kcal-badge">🔥 ${totalCal} kcal</div>
    </div>
  </div>`;

// Timer banner
if(state.tActive||state.tSec>0){
const pct=state.tMax>0?Math.round(((state.tMax-state.tSec)/state.tMax)*100):0;
const col=state.tSec===0?”#22c55e”:state.tSec<10?”#ef4444”:”#fff”;
const bg=state.tSec===0?“rgba(34,197,94,0.2)”:“rgba(124,58,237,0.25)”;
html+=` <div class="timer-banner" style="background:${bg}"> <div> <div style="font-size:11px;color:#a78bfa;margin-bottom:2px">${state.tSec===0?"✅ 完了！":"⏱ "+state.tLbl}</div> <div class="timer-num" style="color:${col}">${fmtTime(state.tSec)}</div> </div> <div style="text-align:right"> <div class="timer-bar-wrap"><div class="timer-bar" style="width:${pct}%"></div></div> <button onclick="stopTimer()" style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#f87171;border-radius:8px;padding:4px 12px;font-size:12px;">停止</button> </div> </div>`;
}

// Tabs
const tabs=[{k:“preset”,l:“⚡ メニュー”},{k:“record”,l:“📝 記録”},{k:“effect”,l:“💪 効果”},{k:“history”,l:“📅 履歴”},{k:“graph”,l:“📊 グラフ”}];
html+=`<div class="tabs">`;
tabs.forEach(t=>html+=`<button class="tab-btn${state.tab===t.k?" active":""}" onclick="setTab('${t.k}')">${t.l}</button>`);
html+=`</div><div class="content">`;

// ══ プリセット ══
if(state.tab===“preset”){
const presetTotal=PRESET.steps.reduce((s,st)=>s+stepCal(st,exs),0);
html+=`<div class="card" style="border-color:rgba(167,139,250,0.4)"> <div style="font-size:13px;font-weight:700;color:#c4b5fd;margin-bottom:3px">${PRESET.name}</div> <div style="font-size:11px;color:#64748b;margin-bottom:12px">インターバル目安: ${PRESET.intervalSec}秒</div>`;

```
PRESET.steps.forEach((st,i)=>{
  const ex=exs.find(e=>e.id===st.exId);
  const cal=stepCal(st,exs);
  const isA=state.step===i;
  const detail=st.sec>0?`${st.sec}秒 × ${st.sets}セット`:st.weight>0?`${st.weight}kg × ${st.reps}回 × ${st.sets}セット`:`${st.reps}回 × ${st.sets}セット`;
  const tags=ex?ex.muscles.map(m=>`<span class="tag" style="background:${MC[m]||"#888"}33;color:${MC[m]||"#888"};border:1px solid ${MC[m]||"#888"}55">${ME[m]||"🏋️"} ${m}</span>`).join(""):"";
  html+=`<div class="step-card${isA?" active":""}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
          <span class="step-num">${i+1}</span>
          <span style="font-size:13px;font-weight:700">${st.label}</span>
        </div>
        <div style="font-size:11px;color:#64748b;margin-left:26px">${detail}${st.note?`<span style="color:#a78bfa;margin-left:6px">— ${st.note}</span>`:""}</div>
        <div style="display:flex;gap:5px;margin-top:5px;margin-left:26px;flex-wrap:wrap">${tags}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:8px">
        <div style="color:#fbbf24;font-weight:700;font-size:12px;margin-bottom:5px">${cal} kcal</div>
        <button onclick="setStep(${i})" style="display:block;margin-bottom:5px;background:${isA?"rgba(124,58,237,0.4)":"rgba(255,255,255,0.06)"};border:1px solid ${isA?"#7c3aed":"rgba(255,255,255,0.15)"};color:${isA?"#c4b5fd":"#94a3b8"};border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;width:100%">${isA?"✓ 実施中":"開始"}</button>
        <button onclick="startTimer(${PRESET.intervalSec},'インターバル (種目${i+1}後)')" style="display:block;background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.3);color:#67e8f9;border-radius:8px;padding:3px 10px;font-size:11px;width:100%">⏱ 休憩</button>
      </div>
    </div>
  </div>`;
});

html+=`<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;align-items:center">
  <div style="font-size:13px;color:#fbbf24;font-weight:700">🔥 ${presetTotal} kcal</div>
  ${!state.done
    ?`<button class="btn-green" onclick="finishPreset()">✅ 完了・記録する</button>`
    :`<div style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#86efac;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700">✅ 記録済み！</div>`}
</div></div>`;

html+=`<div class="card"><div class="section-title">⏱ カスタムインターバル</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${[30,45,60,90,120].map(s=>`<button class="btn-cyan" onclick="startTimer(${s},'インターバル ${s}秒')">${s}秒</button>`).join("")}
  </div></div>`;
```

}

// ══ 記録 ══
if(state.tab===“record”){
html+=`<div class="card"> <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"> <div class="section-title">＋ エクササイズを追加</div> <button onclick="toggleCustomForm()" style="background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);color:#c4b5fd;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700">＋ 種目を作る</button> </div>`;

```
if(state.showC){
  const musButtons=MUSCLES.map(m=>`<button onclick="toggleCMus('${m}')" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid ${state.cMus.includes(m)?MC[m]:"rgba(255,255,255,0.1)"};background:${state.cMus.includes(m)?MC[m]+"33":"rgba(255,255,255,0.04)"};color:${state.cMus.includes(m)?MC[m]:"#64748b"}">${ME[m]} ${m}</button>`).join("");
  html+=`<div class="custom-form">
    <div style="font-size:12px;font-weight:700;color:#c4b5fd;margin-bottom:10px">🆕 オリジナル種目を追加</div>
    <div style="margin-bottom:8px"><div class="lbl">種目名（必須）</div>
      <input class="inp" type="text" maxlength="30" placeholder="例: ケトルベルスイング" value="${state.cName}" oninput="setState('cName',this.value)"></div>
    <div class="row" style="margin-bottom:8px">
      <div><div class="lbl">単位</div>
        <select class="inp" onchange="setState('cUnit',this.value)">${UNITS.map(u=>`<option value="${u}"${state.cUnit===u?" selected":""}>${u}</option>`).join("")}</select></div>
      <div><div class="lbl">運動強度 MET</div>
        <input class="inp" type="number" min="1" max="25" step="0.5" value="${state.cMet}" oninput="setState('cMet',this.value)"></div>
    </div>
    <div style="margin-bottom:10px"><div class="lbl">鍛える部位（複数可）</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${musButtons}</div></div>
    ${state.cErr?`<div class="err-box">⚠️ ${state.cErr}</div>`:""}
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="cancelCustom()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;border-radius:8px;padding:6px 14px;font-size:12px">キャンセル</button>
      <button class="btn-primary" onclick="saveCustom()" style="padding:6px 16px;font-size:12px">保存</button>
    </div>
  </div>`;
}

// ─── Actions ─────────────────────────────────────────────────────────────────
function setTab(t){state.tab=t;state.err=””;render();}
function setVDate(d){state.vDate=d;render();}
function setState(k,v){state[k]=v;}
function selEx(id){state.sel=state.sel===id?null:id;state.err=””;render();}
function toggleCustomForm(){state.showC=!state.showC;render();}
function cancelCustom(){state.showC=false;state.cErr=””;render();}
function toggleCMus(m){state.cMus=state.cMus.includes(m)?state.cMus.filter(x=>x!==m):[…state.cMus,m];render();}
function setStep(i){state.step=state.step===i?null:i;render();}

function startTimer(sec,lbl){
clearInterval(timerInterval);
state.tSec=sec;state.tMax=sec;state.tLbl=lbl;state.tActive=true;
render();
timerInterval=setInterval(()=>{
state.tSec–;
if(state.tSec<=0){clearInterval(timerInterval);state.tActive=false;state.tSec=0;}
render();
},1000);
}
function stopTimer(){clearInterval(timerInterval);state.tActive=false;state.tSec=0;render();}

function finishPreset(){
const exs=[…BASE,…state.custom];
const cal=PRESET.steps.reduce((s,st)=>s+stepCal(st,exs),0);
const entry={id:Date.now(),exId:“pullup”,name:PRESET.name,muscles:[“背中”,“腕”,“腹”,“脚”,“全身”],calories:cal,effect:35,detail:`${PRESET.steps.length}種目 合計`};
const k=todayKey();
if(!state.data[k])state.data[k]=[];
state.data[k].push(entry);
state.done=true;state.step=null;
save();render();
}

function addEx(){
state.err=””;
const exs=[…BASE,…state.custom];
const ex=exs.find(e=>e.id===state.sel);
if(!ex){state.err=“種目を選んでください”;render();return;}
let cal,detail,rN,sN,wN,mN,scN;
if(ex.unit===“分”){
mN=vInt(state.mins,1,600);if(!mN){state.err=“1〜600分で入力してください”;render();return;}
cal=Math.round(ex.met*BW*mN/60);detail=`${mN}分`;
}else if(ex.unit===“秒”||ex.unit===“秒×セット”){
scN=vInt(state.secs,1,600);sN=vInt(state.sets,1,20);
if(!scN){state.err=“1〜600秒で入力してください”;render();return;}
if(!sN){state.err=“1〜20セット”;render();return;}
cal=Math.round(ex.met*BW*(scN*sN)/3600);detail=`${scN}秒×${sN}セット`;
}else{
rN=vInt(state.reps,1,500);sN=vInt(state.sets,1,20);
if(!rN){state.err=“1〜500回で入力してください”;render();return;}
if(!sN){state.err=“1〜20セット”;render();return;}
if(ex.unit.includes(“kg”)){
wN=vInt(state.wt,0,500);if(wN===null){state.err=“0〜500kgで入力してください”;render();return;}
cal=Math.round((wN||BW)*rN*sN*ex.met*0.0012);
detail=wN>0?`${wN}kg × ${rN}回 × ${sN}セット`:`${rN}回 × ${sN}セット`;
}else{cal=Math.round(BW*rN*sN*ex.met*0.0012);detail=`${rN}回 × ${sN}セット`;}
}
const eff=Math.min(40,Math.round(((rN||1)*(sN||1))/3));
const entry={id:Date.now(),exId:ex.id,name:ex.name,muscles:ex.muscles,calories:cal,effect:eff,detail};
const k=todayKey();
if(!state.data[k])state.data[k]=[];
state.data[k].push(entry);
state.sel=null;
save();render();
}

function rmEntry(id){
const k=todayKey();
state.data[k]=(state.data[k]||[]).filter(e=>e.id!==id);
save();render();
}

function saveCustom(){
state.cErr=””;
const name=state.cName.trim();
if(!name){state.cErr=“種目名を入力してください”;render();return;}
if(name.length>30){state.cErr=“30文字以内”;render();return;}
const met=parseFloat(state.cMet);
if(!Number.isFinite(met)||met<1||met>25){state.cErr=“運動強度は1〜25で入力してください”;render();return;}
if(state.cMus.length===0){state.cErr=“部位を1つ以上選んでください”;render();return;}
state.custom.push({id:`custom_${Date.now()}`,name,muscles:state.cMus,met,unit:state.cUnit,isCustom:true});
state.cName=””;state.cMet=“5”;state.cUnit=“回”;state.cMus=[];state.cErr=””;state.showC=false;
save();render();
}

function delCustom(id){
state.custom=state.custom.filter(e=>e.id!==id);
if(state.sel===id)state.sel=null;
save();render();
}

render();
